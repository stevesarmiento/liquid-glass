name: Feature request
description: Suggest an API, renderer, component, or workflow improvement.
title: "[Feature]: "
labels:
  - enhancement
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What are you trying to build or improve?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposal
      description: What would a good solution look like?
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Public API
        - Engine math
        - WASM
        - DOM/SVG renderer
        - Canvas/WebGL renderer
        - React primitives
        - Design system
        - Playground/docs
        - Native adapters
        - Research tools
        - Other
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives
      description: Any tradeoffs, workarounds, or existing APIs you considered.
