[package]
name = "liquid-glass-core"
version = "0.1.0"
edition = "2021"
description = "Deterministic liquid-glass lens math and displacement-map generation."
license = "MIT"
repository = "https://github.com/stevesarmiento/liquid-glass"

[lib]
crate-type = ["rlib", "cdylib", "staticlib"]

[dependencies]
serde = { version = "1", features = ["derive"] }

[target.'cfg(target_arch = "wasm32")'.dependencies]
js-sys = "0.3"
serde-wasm-bindgen = "0.6"
wasm-bindgen = "0.2"

[target.'cfg(target_arch = "wasm32")'.dev-dependencies]
wasm-bindgen-test = "0.3"
